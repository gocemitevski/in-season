name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check:data
      - name: Set SITE_URL
        env:
          VAR_SITE_URL: ${{ vars.SITE_URL }}
          VAR_GA_ID: ${{ vars.GA_MEASUREMENT_ID }}
        run: |
          if [ -n "$VAR_SITE_URL" ]; then
            SITE_URL="$VAR_SITE_URL"
          else
            SITE_URL="https://in-season.gocemitevski.com"
          fi
          echo "SITE_URL=$SITE_URL" >> "$GITHUB_ENV"
          echo "Building for $SITE_URL"
          if [ -n "$VAR_GA_ID" ]; then
            echo "GA measurement ID configured"
          else
            echo "::warning::GA_MEASUREMENT_ID is not set — analytics disabled in this build"
          fi
      - run: npm run build
        env:
          VITE_GA_ID: ${{ vars.GA_MEASUREMENT_ID }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
