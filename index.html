        <h1>In Season</h1>
        <p>
          See which fruits and vegetables are in season this month in your country. This
          interactive guide covers 197 countries and 62 seasonal produce items, with climate
          zones and southern-hemisphere month shifts taken into account.
        </p>
        <h2>How to use this site</h2>
        <p>
          Enable JavaScript to pick a month, switch between fruits and vegetables, and choose
          your country. Without JavaScript, browse the seasonal highlights below, then follow
          each item’s Wikipedia link for growing seasons and varieties.
        </p>
        <h2>Seasonal produce highlights</h2>
        <ul>
          <li>
            <a href="https://en.wikipedia.org/wiki/Strawberry">Strawberry</a> — spring to early
            summer in temperate zones
          </li>
          <li><a href="https://en.wikipedia.org/wiki/Tomato">Tomato</a> — high summer</li>
          <li><a href="https://en.wikipedia.org/wiki/Apple">Apple</a> — late summer through winter stores</li>
          <li>
            <a href="https://en.wikipedia.org/wiki/Squash_(fruit)">Squash</a> — autumn
          </li>
          <li><a href="https://en.wikipedia.org/wiki/Citrus">Citrus</a> — winter in many regions</li>
        </ul>
        <p>
          Seasonality varies by region, altitude, and growing method. Approximate months only.
        </p>
